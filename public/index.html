<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Entrar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">NETFLIX</a>
  </header>

  <main>
    <div class="login-box">
      <h2>Entrar</h2>
      <form id="login-form">
        <div class="input-group">
          <input type="email" id="email" placeholder="Email ou número de celular" required>
        </div>
        <div class="input-group">
          <input type="password" id="senha" placeholder="Senha" required>
        </div>
        <button type="submit">Entrar</button>
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" checked> Lembre-se de mim
          </label>
          <a href="#" class="help-link">Precisa de ajuda?</a>
        </div>
      </form>
      <div class="signup-now">
        Novo por aqui? <a href="cadastro.html">Assine agora.</a>
      </div>
      <p class="recaptcha-text">
        Esta página é protegida pelo Google reCAPTCHA para garantir que você não é um robô.
      </p>
    </div>
  </main>

  <footer>
    <p>Dúvidas? Ligue 0800 591 2876 &bull; Netflix Brasil</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
