<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Assine Agora</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-box {
      max-width: 580px !important;
      padding: 45px 40px !important;
    }
    .grid-campos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .grid-campos .full-width {
      grid-column: span 2;
    }
    .grid-campos input {
      margin-bottom: 0 !important;
    }
    @media (max-width: 600px) {
      .grid-campos {
        grid-template-columns: 1fr;
      }
      .grid-campos .full-width {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">NETFLIX</a>
  </header>

  <main>
    <div class="login-box">
      <h2>Criar Conta</h2>
      <form id="cadastro-form">
        <div class="grid-campos">
          <input type="text" id="nome" placeholder="Nome" required>
          <input type="text" id="sobrenome" placeholder="Sobrenome" required>
          
          <input type="text" id="cpf" placeholder="CPF (ex: 000.000.000-00)" maxlength="14" required>
          <input type="tel" id="telefone" placeholder="Telefone (ex: (11) 99999-9999)" maxlength="15" required>
          
          <input type="email" id="email" placeholder="E-mail" class="full-width" required>
          <input type="password" id="senha" placeholder="Senha" class="full-width" required>
          
          <input type="text" id="cep" placeholder="CEP (ex: 00000-000)" maxlength="9" required>
          <input type="text" id="estado" placeholder="Estado (ex: SP)" maxlength="2" required>
          
          <input type="text" id="cidade" placeholder="Cidade" required>
          <input type="text" id="rua" placeholder="Rua e número" required>
        </div>

        <button type="submit" style="margin-top: 22px;">Cadastrar</button>
      </form>

      <div class="signup-now">
        Já tem uma conta? <a href="index.html">Entrar agora.</a>
      </div>
    </div>
  </main>

  <footer>
    <p>Dúvidas? Ligue 0800 591 2876 &bull; Netflix Brasil</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
